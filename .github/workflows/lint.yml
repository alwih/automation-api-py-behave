name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    # No API calls here, so it runs next to the API tests without touching DummyJSON's rate limit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      # mypy needs the runtime libraries too, to read their types
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same hooks as a local commit: whitespace, JSON/YAML/TOML syntax, ruff and mypy
      - name: Pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
