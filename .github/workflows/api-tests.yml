name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, to catch changes in the public APIs between commits
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      tags:
        description: "Behave tag expression, e.g. @dummyjson or @known_issue"
        default: "@regression and {config.tags}"

permissions:
  contents: read

concurrency:
  # One run per branch at a time; a new push to a pull request replaces its running check
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A single job on purpose: the scenarios share DummyJSON's rate limit, so they run one after another
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DUMMYJSON_USERNAME: ${{ secrets.DUMMYJSON_USERNAME }}
      DUMMYJSON_PASSWORD: ${{ secrets.DUMMYJSON_PASSWORD }}
      # A manual run picks its scenarios; every other run is the full regression.
      # make reads it from the environment, so the input is never pasted into a shell command.
      TAGS: ${{ inputs.tags || '@regression and {config.tags}' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests
        run: make unit

      - name: Check DummyJSON credentials
        run: |
          if [ -z "$DUMMYJSON_USERNAME" ] || [ -z "$DUMMYJSON_PASSWORD" ]; then
            echo "::error::Add the DUMMYJSON_USERNAME and DUMMYJSON_PASSWORD repository secrets (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Smoke
        run: make smoke

      - name: Scenarios (${{ env.TAGS }})
        run: make tagged

      # The steps below also run after a failure, which is when the reports matter most

      - name: Job summary
        if: ${{ !cancelled() }}
        run: python scripts/junit_summary.py reports/junit >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JUnit XML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit
          path: reports/junit
          retention-days: 14
          overwrite: true  # a re-run of the job replaces the files instead of failing on the name

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 14
          overwrite: true
