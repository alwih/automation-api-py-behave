# Runs on every commit after "pre-commit install"; "make lint" runs it on every file.
# ruff and mypy run from the active environment, so they use the versions pinned in requirements-dev.txt.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (api/ and config/)
        # Checks the files listed in pyproject.toml, whichever files changed
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
