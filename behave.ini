[behave]
paths = features
default_format = pretty
show_skipped = false
# Used only when no --tags is given on the command line
default_tags = not (@known_issue or @wip)
# JUnit XML is written only with --junit
junit_directory = reports/junit

[behave.formatters]
# Writes Allure results to the directory given after it with -o: -f allure -o reports/allure-results
allure = allure_behave.formatter:AllureFormatter
